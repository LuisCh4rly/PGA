spring.application.name=PGA

spring.datasource.url=jdbc:postgresql://localhost:5432/PGA
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibern
ate.SQL=debug

#inicializar Data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:300000}

#Email-Sender
#servidor
spring.mail.host=smtp.gmail.com
#puerto que se usa
spring.mail.port=587
#cuenta que se usa
spring.mail.username=aplataformagestionacademica@gmail.com
#generada para la aplicacion
spring.mail.password=${PASSWORD_MAIL}
#habilitar autenticacion
spring.mail.properties.mail.smtp.auth = true
#habilitar encriptacion tls
spring.mail.properties.mail.smtp.starttls.enable=true

